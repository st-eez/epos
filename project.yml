name: Epos
options:
  bundleIdPrefix: com.steez
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Epos:
    path: .

targets:
  EposMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/EposMacApp
      - path: Resources/Assets.xcassets
    dependencies:
      - package: Epos
        product: Epos
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Epos
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: Epos records your voice to transcribe dictation into the focused text field.
        NSSpeechRecognitionUsageDescription: Epos uses on-device speech recognition to turn your voice into text.
    entitlements:
      path: Resources/Epos.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steez.Epos
        PRODUCT_NAME: Epos
        PRODUCT_MODULE_NAME: EposMacApp
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
