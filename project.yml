name: SteezFlow
options:
  bundleIdPrefix: com.steez
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  SteezFlow:
    path: .

targets:
  SteezFlowMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/SteezFlowMacApp
    dependencies:
      - package: SteezFlow
        product: SteezFlow
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: SteezFlow
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: SteezFlow records your voice to transcribe dictation into the focused text field.
        NSSpeechRecognitionUsageDescription: SteezFlow uses on-device speech recognition to turn your voice into text.
    entitlements:
      path: Resources/SteezFlow.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steez.SteezFlow
        PRODUCT_NAME: SteezFlowMacApp
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
