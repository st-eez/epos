name: SteezFlow
options:
  bundleIdPrefix: com.steez
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  SteezFlow:
    path: .

targets:
  SteezFlowMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/SteezFlowMacApp
    dependencies:
      - package: SteezFlow
        product: SteezFlow
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/SteezFlow.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steez.SteezFlow
        PRODUCT_NAME: SteezFlowMacApp
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
